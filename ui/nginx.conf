server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/catalog/ {
    proxy_pass http://catalog-service:8000;
  }

  location /api/reviews/ {
    proxy_pass http://reviews-service:8000;
  }

  location /api/insights/ {
    proxy_pass http://insights-service:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
